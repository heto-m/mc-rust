[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
mcr-buf = { path = "crates/mcr-buf" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
rustc-hash = "2"
thiserror = "2"
tracing = "0.1"
syn = "2"
quote = "1"
proc-macro2 = "1"
mcr-buf-derive = { path = "crates/mcr-buf-derive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
rsa = "0.9"
rand = "0.8"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"
time = { version = "0.3", features = ["parsing"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true
