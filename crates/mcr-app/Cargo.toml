[package]
name = "mcr-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mcr"
path = "src/main.rs"

[features]
heap-profile = []

[dependencies]
mcr-anvil = { path = "../mcr-anvil" }
mcr-animate = { path = "../mcr-animate" }
mcr-block-entity = { path = "../mcr-block-entity" }
mcr-nbt = { path = "../mcr-nbt" }
mcr-assets = { path = "../mcr-assets" }
mcr-data = { path = "../mcr-data" }
mcr-entity-model = { path = "../mcr-entity-model" }
mcr-particles = { path = "../mcr-particles" }
mcr-audio = { path = "../mcr-audio" }
mcr-auth = { path = "../mcr-auth" }
mcr-launcher = { path = "../mcr-launcher" }
mcr-respack = { path = "../mcr-respack" }
mcr-buf.workspace = true
mcr-client = { path = "../mcr-client" }
mcr-net = { path = "../mcr-net" }
mcr-mesh = { path = "../mcr-mesh" }
mcr-modbridge = { path = "../mcr-modbridge" }
mcr-physics = { path = "../mcr-physics" }
mcr-protocol = { path = "../mcr-protocol" }
mcr-settings = { path = "../mcr-settings" }
mcr-singleplayer = { path = "../mcr-singleplayer" }
mcr-ui = { path = "../mcr-ui" }
bytemuck = { version = "1", features = ["derive"] }
serde_json.workspace = true
base64.workspace = true
uuid = "1"
mcr-render = { path = "../mcr-render" }
mcr-world = { path = "../mcr-world" }
png.workspace = true
rustc-hash.workspace = true
tracing.workspace = true
winit = "0.30"
arboard = { version = "3.6", default-features = false }
anyhow = "1"
thiserror.workspace = true
zip.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[lints]
workspace = true
